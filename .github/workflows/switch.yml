name: Switch homebrew

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nro:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:20240827
    steps:
      - uses: actions/checkout@v4
      - name: Build NRO
        env:
          BUILD_JOBS: 4
        run: bash docker/build_switch.sh
      - name: Verify NRO and embedded assets
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc libc6-dev
          python3 client/tests/test_switch_build.py
      - uses: actions/upload-artifact@v4
        with:
          name: dynablaster-switch
          path: client/build-switch/gcc14/dynablaster_revenge.nro
          if-no-files-found: error
