name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure client
        run: cmake -S client -B client/build -A x64

      - name: Build client
        run: cmake --build client/build --config Release --parallel

      - name: Configure server
        run: cmake -S server -B server/build -A x64

      - name: Build server
        run: cmake --build server/build --config Release --parallel

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p artifact/dynablaster
          cp client/build/Release/dynablaster_revenge.exe artifact/dynablaster/
          cp server/build/Release/dynablaster_server.exe artifact/dynablaster/
          cp -r client/data artifact/dynablaster/data

      - uses: actions/upload-artifact@v4
        with:
          name: dynablaster-windows
          path: artifact/dynablaster

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL3 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxss-dev \
            libxcursor-dev libxfixes-dev libxinerama-dev libxtst-dev \
            libwayland-dev libdecor-0-dev wayland-protocols \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      - name: Configure client
        run: cmake -S client -B client/build -DCMAKE_BUILD_TYPE=Release

      - name: Build client
        run: cmake --build client/build --parallel $(nproc)

      - name: Configure server
        run: cmake -S server -B server/build -DCMAKE_BUILD_TYPE=Release

      - name: Build server
        run: cmake --build server/build --parallel $(nproc)

      - name: Package artifact
        run: |
          mkdir -p artifact/dynablaster
          cp client/build/dynablaster_revenge artifact/dynablaster/
          cp server/build/dynablaster_server artifact/dynablaster/
          cp -r client/data artifact/dynablaster/data

      - uses: actions/upload-artifact@v4
        with:
          name: dynablaster-linux
          path: artifact/dynablaster

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure client
        run: cmake -S client -B client/build -DCMAKE_BUILD_TYPE=Release

      - name: Build client
        run: cmake --build client/build --parallel $(sysctl -n hw.ncpu)

      - name: Configure server
        run: cmake -S server -B server/build -DCMAKE_BUILD_TYPE=Release

      - name: Build server
        run: cmake --build server/build --parallel $(sysctl -n hw.ncpu)

      - name: Package artifact
        run: |
          mkdir -p artifact/dynablaster
          cp client/build/dynablaster_revenge artifact/dynablaster/
          cp server/build/dynablaster_server artifact/dynablaster/
          cp -r client/data artifact/dynablaster/data

      - uses: actions/upload-artifact@v4
        with:
          name: dynablaster-macos
          path: artifact/dynablaster

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: 6.0.1

      - name: Configure client
        run: emcmake cmake -S client -B client/build-wasm -DCMAKE_BUILD_TYPE=Release -DDYNABLASTER_NETWORK_TESTS=ON

      - name: Build client
        run: cmake --build client/build-wasm --target dynablaster_revenge dynablaster_network_test --parallel $(nproc)

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build native integration server
        run: |
          cmake -S server -B server/build-network -DCMAKE_BUILD_TYPE=Release -DSDL_UNIX_CONSOLE_BUILD=ON
          cmake --build server/build-network --parallel $(nproc)

      - name: Test bridge and WebAssembly network gameplay
        run: |
          python -m pip install -r web/requirements.txt
          python -m unittest discover -s web/tests -v
          python web/tests/run_network_game.py --server server/build-network/dynablaster_server --probe client/build-wasm/dynablaster_network_test.js --node node
          DYNABLASTER_TEST_SERVER='ws://[invalid' node client/build-wasm/dynablaster_network_test.js --expect-failure
          DYNABLASTER_TEST_SERVER='ws://127.0.0.1:1/' node client/build-wasm/dynablaster_network_test.js --expect-failure
          node client/build-wasm/dynablaster_network_test.js --embedded

      - name: Test actual browser gameplay and embedded server
        run: |
          python -m pip install -r web/tests/requirements-browser.txt
          python -m playwright install --with-deps chromium
          python web/tests/browser_playtest.py --build client/build-wasm --output build/browser-embedded-probe --probe
          python web/tests/browser_playtest.py --build client/build-wasm --output build/browser-network-probe --probe --native-server server/build-network/dynablaster_server
          python web/tests/browser_playtest.py --build client/build-wasm --output build/browser-local --steps web/tests/multiplayer.steps --expect "game 1 started"
          python web/tests/browser_playtest.py --build client/build-wasm --output build/browser-network --steps web/tests/multiplayer.steps --native-server server/build-network/dynablaster_server --expect "game 1 started"
          python web/tests/browser_playtest.py --build client/build-wasm --output build/browser-story --steps web/tests/story.steps --expect "game 1 started"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-playtest-evidence
          path: build/browser-*

      - name: Package artifact
        run: |
          mkdir -p artifact/dynablaster-wasm
          cp client/build-wasm/dynablaster_revenge.html artifact/dynablaster-wasm/
          cp client/build-wasm/dynablaster_revenge.js artifact/dynablaster-wasm/
          cp client/build-wasm/dynablaster_revenge.wasm artifact/dynablaster-wasm/
          cp client/build-wasm/dynablaster_revenge.data artifact/dynablaster-wasm/

      - uses: actions/upload-artifact@v4
        with:
          name: dynablaster-wasm
          path: artifact/dynablaster-wasm
